id: IEE2E-38
exercise: 38
title: "Create PIR in Demand Management"
tags: [unit7, pp, planning, gui]
description: >
  The initial stock receipt is not posted again when initialStockDoc was captured by an earlier run.
steps:
  # Task 1: initial stock of the components (Post Goods Movement = MIGO)
  - unless: "${initialStockDoc}"
    openApp: { title: Post Goods Movement }
  - unless: "${initialStockDoc}"
    select: { combobox: 0, value: Goods Receipt, frame: app }
  - unless: "${initialStockDoc}"
    select: { combobox: 1, value: Other, frame: app }
  # The item overview is read-only here; each item is entered in the detail tabs below it.
  - unless: "${initialStockDoc}"
    fill: { label: Material, value: "S11-${grp}", enter: true, frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Quantity, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Qty in Unit of Entry, value: "500", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Where, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { fields: { Plant: "1010", Storage Location: 101A }, frame: app, index: -1 }
  - unless: "${initialStockDoc}"
    press: Enter
  - name: Next item
    unless: "${initialStockDoc}"
    click: { selector: "[title='Next Item']", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Material, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Material, value: "S12-${grp}", enter: true, frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Quantity, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Qty in Unit of Entry, value: "500", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Where, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { fields: { Plant: "1010", Storage Location: 101A }, frame: app, index: -1 }
  - unless: "${initialStockDoc}"
    press: Enter
  - name: Next item
    unless: "${initialStockDoc}"
    click: { selector: "[title='Next Item']", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Material, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Material, value: "S13-${grp}", enter: true, frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Quantity, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Qty in Unit of Entry, value: "500", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Where, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { fields: { Plant: "1010", Storage Location: 101A }, frame: app, index: -1 }
  - unless: "${initialStockDoc}"
    press: Enter
  - name: Next item
    unless: "${initialStockDoc}"
    click: { selector: "[title='Next Item']", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Material, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Material, value: "R14-${grp}", enter: true, frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Quantity, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Qty in Unit of Entry, value: "500", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Where, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { fields: { Plant: "1010", Storage Location: 101C }, frame: app, index: -1 }
  - unless: "${initialStockDoc}"
    press: Enter
  - name: Next item
    unless: "${initialStockDoc}"
    click: { selector: "[title='Next Item']", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Material, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Material, value: "S15-${grp}", enter: true, frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Quantity, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { label: Qty in Unit of Entry, value: "1000", frame: app }
  - unless: "${initialStockDoc}"
    click: { text: Where, role: tab, frame: app }
  - unless: "${initialStockDoc}"
    fill: { fields: { Plant: "1010", Storage Location: 101B }, frame: app, index: -1 }
  - unless: "${initialStockDoc}"
    press: Enter
  - unless: "${initialStockDoc}"
    click: Post
  - unless: "${initialStockDoc}"
    expectMessage:
      regex: "Material document \\d+ posted|\\d{9,10}"
      capture: { var: initialStockDoc, regex: "(\\d{9,10})" }

  # Task 2: area of responsibility
  - openApp: { title: My Area of Responsibility - MRP Controller }
  - selectRow: "001"
  - click: [Assign, AOR Assigned]
  - manual: Make sure only MRP controller 001 / plant 1010 is assigned (unassign others).

  # Task 3: planned independent requirements
  - openApp: { title: Maintain PIRs }
  - fill:
      Material: F1-${grp}
      Plant: "1010"
  - optional: true
    select: { label: Period Indicator, value: Monthly }
  - click: Go
  - selectRow: F1-${grp}
  - click: Create
  - fill:
      dialog: true
      fields:
        Version: "00"
        Requirements Type: VSF
  - check: { label: Version Active, dialog: true }
  - click: { text: Create and Edit, dialog: true }
  - manual: >
      Enter draft PIR quantities for F1-${grp}: current month 0, next three months 100 each,
      then save.
