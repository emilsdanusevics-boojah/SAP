id: IEE2E-33
exercise: 33
title: "Change Product Master Record for Finished Product (strategy 40)"
tags: [unit7, pp, master-data, gui]
description: |
  Changes F1-### from make-to-order to make-to-stock (strategy group 20 -> 40).
  The guide warns not to do this while a parallel Controlling training uses the system.
steps:
  - openApp: { title: Change Material }
  - fill: { label: Material, value: "F1-${grp}", enter: true }
  - selectRow: { contains: MRP 3, dialog: true }
  - press: Enter
  - fill: { label: Plant, value: "1010", dialog: true }
  - press: Enter
  - click: { text: MRP 3, role: tab }
  - fill: { Strategy Group: "40" }
  - press: Enter
  - click: Save
  - expectMessage: { regex: "changed|saved" }
