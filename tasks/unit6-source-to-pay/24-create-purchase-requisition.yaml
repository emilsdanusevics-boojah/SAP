id: IEE2E-24
exercise: 24
title: "Create a Purchase Requisition"
tags: [unit6, mm, purchasing]
requires: [IEE2E-23]
description: >
  Two purchase requisitions for R124-###. A requisition whose description exists already
  (FIRST / SECOND PR GR###) is not created again.
steps:
  # 1. Default values for purchase requisitions
  - openApp: { title: Default Settings for Users }
  - name: User ID (only when the app asks for it)
    optional: true
    timeout: 3000
    fill: { User ID: "${user}" }
  - fill:
      Plant: "1010"
      Company Code: "1010"
      Storage Location: 101C
      Currency: EUR
      Purchasing Group: "000"
      Purch. Organization | Purchasing Org.: "1010"
      Purchasing Doc. Type | Purchasing Document Type: NB
      Cost Center: MAN-${grp}
      Account Assignment Category: K
  - click: Save
  - expectNoError: true

  # 2. First purchase requisition (drafts left by earlier attempts are discarded first, up to three)
  - openApp: { title: Manage Purchase Requisitions - Professional }
  - select: { label: Editing Status, value: Own Draft }
  - click: Go
  - detect: { row: Draft, var: prDraft }
  - when: "${prDraft}"
    openRow: Draft
  - when: "${prDraft}"
    click: Discard Draft
  - name: Confirm the discard
    when: "${prDraft}"
    optional: true
    timeout: 5000
    click: { text: Discard, role: button, index: -1 }
  - when: "${prDraft}"
    openApp: { title: Manage Purchase Requisitions - Professional }
  - select: { label: Editing Status, value: Own Draft }
  - click: Go
  - detect: { row: Draft, var: prDraft }
  - when: "${prDraft}"
    openRow: Draft
  - when: "${prDraft}"
    click: Discard Draft
  - name: Confirm the discard
    when: "${prDraft}"
    optional: true
    timeout: 5000
    click: { text: Discard, role: button, index: -1 }
  - when: "${prDraft}"
    openApp: { title: Manage Purchase Requisitions - Professional }
  - select: { label: Editing Status, value: Own Draft }
  - click: Go
  - detect: { row: Draft, var: prDraft }
  - when: "${prDraft}"
    openRow: Draft
  - when: "${prDraft}"
    click: Discard Draft
  - name: Confirm the discard
    when: "${prDraft}"
    optional: true
    timeout: 5000
    click: { text: Discard, role: button, index: -1 }
  - when: "${prDraft}"
    openApp: { title: Manage Purchase Requisitions - Professional }
  - name: Saved requisitions only
    optional: true
    timeout: 5000
    select: { label: Editing Status, value: All (Hiding Drafts) }
  - fill: { label: Search, value: "FIRST PR GR${grp}", enter: true }
  - click: Go
  - name: FIRST PR GR${grp} there already?
    detect: { row: "FIRST PR GR${grp}", var: pr1Exists }
  - name: Its number
    when: "${pr1Exists}"
    capture: { var: prNo1, from: cell, rowContains: "FIRST PR GR${grp}", column: [Purchase Requisition, Purch. Req.], regex: "(\\d{8,10})" }
  - unless: "${pr1Exists}"
    click: Create
  - unless: "${pr1Exists}"
    fill: { Purchase Requisition Description | Purchase Requisition Descrip.: "FIRST PR GR${grp}" }
  - unless: "${pr1Exists}"
    click: { text: Create, within: Items }
  - unless: "${pr1Exists}"
    click: [Create Material, Material]
  - unless: "${pr1Exists}"
    fill:
      Material: R124-${grp}
      Quantity | Quantity Requested: "20"
      Delivery Date: ${date(+10d)}
  - unless: "${pr1Exists}"
    click: { text: Account Assignment, role: tab }
  - name: Open the account assignment line (the table shows no Cost Center column)
    unless: "${pr1Exists}"
    openRow: { row: 1, within: Account Assignment }
  - name: Account assignment K / MAN-${grp} (K and the cost center come from the default settings)
    unless: "${pr1Exists}"
    fill: { label: Cost Center, value: "MAN-${grp}" }
  - name: Back to the item
    unless: "${pr1Exists}"
    click: Apply
  - name: Back to the requisition
    unless: "${pr1Exists}"
    click: Apply
  - unless: "${pr1Exists}"
    click: Create
  - name: Confirm the delivery date dialog (only shown for some dates)
    unless: "${pr1Exists}"
    optional: true
    timeout: 5000
    click: { text: Create, dialog: true }
  - name: Requisition number (page title; the success toast disappears quickly)
    unless: "${pr1Exists}"
    capture: { var: prNo1, from: text, selector: body, regex: "(\\d{8,10})\\s+FIRST PR GR${grp}" }

  # 3. Change quantity to 50
  - openApp: { title: Manage Purchase Requisitions - Professional }
  - click: Go
  - fill: { label: Search, value: "GR${grp}", enter: true }
  - openRow: FIRST PR GR${grp}
  - click: Edit
  - openRow: { row: 1, within: Items }
  - fill: { Quantity | Quantity Requested: "50" }
  - click: Apply
  - click: Save
  - expectNoError: true
  - click: Back

  # 4. Copy as second PR without account assignment
  - openApp: { title: Manage Purchase Requisitions - Professional }
  - fill: { label: Search, value: "SECOND PR GR${grp}", enter: true }
  - click: Go
  - name: SECOND PR GR${grp} there already?
    detect: { row: "SECOND PR GR${grp}", var: pr2Exists }
  - name: Its number
    when: "${pr2Exists}"
    capture: { var: prNo2, from: cell, rowContains: "SECOND PR GR${grp}", column: [Purchase Requisition, Purch. Req.], regex: "(\\d{8,10})" }
  - unless: "${pr2Exists}"
    fill: { label: Search, value: "GR${grp}", enter: true }
  - unless: "${pr2Exists}"
    click: Go
  - unless: "${pr2Exists}"
    selectRow: FIRST PR GR${grp}
  - unless: "${pr2Exists}"
    click: Copy
  - unless: "${pr2Exists}"
    clear: Purchase Requisition Description | Purchase Requisition Descrip.
  - unless: "${pr2Exists}"
    fill: { Purchase Requisition Description | Purchase Requisition Descrip.: "SECOND PR GR${grp}" }
  - unless: "${pr2Exists}"
    openRow: { row: 1, within: Items }
  - unless: "${pr2Exists}"
    clear: Account Assignment Category | Account Assignment Cat.
  - unless: "${pr2Exists}"
    fill:
      Quantity | Quantity Requested: "200"
      Delivery Date: ${date(+13d)}
  - unless: "${pr2Exists}"
    click: Apply
  - unless: "${pr2Exists}"
    click: Create
  - name: Confirm the delivery date dialog (only shown for some dates)
    unless: "${pr2Exists}"
    optional: true
    timeout: 5000
    click: { text: Create, dialog: true }
  - name: Requisition number (page title; the success toast disappears quickly)
    unless: "${pr2Exists}"
    capture: { var: prNo2, from: text, selector: body, regex: "(\\d{8,10})\\s+SECOND PR GR${grp}" }

  # 5. Joule
  - manual: Open Joule and ask "Show purchase requisitions I have created"; open one and check it.
