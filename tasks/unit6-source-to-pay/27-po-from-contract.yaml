id: IEE2E-27
exercise: 27
title: "Create Purchase Order with Reference to Contract"
tags: [unit6, mm, purchasing]
requires: [IEE2E-24, IEE2E-26]
description: >
  The purchase order is created once; with its number known (poNo) only the list check runs.
steps:
  - unless: "${poNo}"
    openApp: { title: Process Purchase Requisitions (V2) }
  - unless: "${poNo}"
    addFilter: Material ID
  - unless: "${poNo}"
    fill: { Material ID: "R124-${grp}" }
  - unless: "${poNo}"
    click: Go
  - unless: "${poNo}"
    expectText: ${prNo1}
  - unless: "${poNo}"
    expectText: ${prNo2}

  - unless: "${poNo}"
    clickCell: { rowContains: "${prNo1}", column: Assign Source of Supply }
  - unless: "${poNo}"
    selectRow: { contains: "${contractNo}", dialog: true }
  - unless: "${poNo}"
    click: { text: Assign, dialog: true }
  - unless: "${poNo}"
    optional: true
    click: { text: [OK, Ok], dialog: true }
  - unless: "${poNo}"
    clickCell: { rowContains: "${prNo2}", column: Assign Source of Supply }
  - unless: "${poNo}"
    selectRow: { contains: "${contractNo}", dialog: true }
  - unless: "${poNo}"
    click: { text: Assign, dialog: true }
  - unless: "${poNo}"
    optional: true
    click: { text: [OK, Ok], dialog: true }
  - unless: "${poNo}"
    click: Go
  - unless: "${poNo}"
    expectText: IEE2E-${grp}

  - unless: "${poNo}"
    selectRow: { contains: ["${prNo1}", "${prNo2}"] }
  - unless: "${poNo}"
    click: Create Purchase Order
  - unless: "${poNo}"
    name: Confirm warnings
    optional: true
    timeout: 4000
    click: { text: [OK, Ok, Continue], dialog: true }
  - unless: "${poNo}"
    select: { label: Purchase Order Type, value: Standard PO }
  - unless: "${poNo}"
    click: Order
  - unless: "${poNo}"
    expectMessage:
      regex: "45\\d{8}"
      capture: { var: poNo, regex: "(45\\d{8})" }

  - openApp: { title: Manage Purchase Orders }
  - fill: { Supplier: "IEE2E-${grp}" }
  - click: Go
  - expectText: ${poNo}
  - manual: >
      Optional extras from the guide: Easy Filter "Show purchase orders for supplier IEE2E-${grp}",
      Add Card to Insights, and Output Management > Display Document.
