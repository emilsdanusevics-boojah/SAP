id: IEE2E-25
exercise: 25
title: "Process RFQ and Quotation"
tags: [unit6, mm, sourcing]
requires: [IEE2E-22, IEE2E-23]
description: >
  The RFQ is created and published once; when "Request for Price ###" exists already its number is
  read from the list and the quotations are entered for it.
steps:
  # 1. RFQ
  - openApp: { title: Manage RFQs }
  - name: Own drafts only
    optional: true
    timeout: 10000
    select: { label: Editing Status, value: Own Draft }
  - fill: { label: Search, value: "Request for Price ${grp}", enter: true }
  - click: Go
  - name: Draft left by an earlier attempt?
    detect: { row: "Request for Price ${grp}", var: rfqDraft }
  - when: "${rfqDraft}"
    openRow: "Request for Price ${grp}"
  - when: "${rfqDraft}"
    click: Discard Draft
  - name: Confirm the discard
    when: "${rfqDraft}"
    optional: true
    timeout: 5000
    click: { text: Discard, role: button, index: -1 }
  - when: "${rfqDraft}"
    openApp: { title: Manage RFQs }
  - name: Saved RFQs only
    optional: true
    timeout: 10000
    select: { label: Editing Status, value: [All (Hiding Drafts), All] }
  - fill: { label: Search, value: "Request for Price ${grp}", enter: true }
  - click: Go
  - name: RFQ there already?
    detect: { row: "Request for Price ${grp}", var: rfqExists }
  - when: "${rfqExists}"
    capture: { var: rfqNo, from: cell, rowContains: "Request for Price ${grp}", column: [RFQ, Request for Quotation], regex: "(\\d{7,10})" }
  - unless: "${rfqExists}"
    click: Create
  - unless: "${rfqExists}"
    click: [Int. Sourcing Req., Internal Sourcing Request]
  - unless: "${rfqExists}"
    fill:
        RFQ Description: Request for Price ${grp}
        Quotation Deadline: ${today}
        Purchasing Organization: "1010"
        Company Code: "1010"
        Purchasing Group: "000"
  - name: Follow-On Document Type (read-only input; picked in its value help)
    unless: "${rfqExists}"
    click: { field: Follow-On Document Type }
  - unless: "${rfqExists}"
    click: { text: Quantity Contract, dialog: true }
  - unless: "${rfqExists}"
    fill:
        Validity Per. Start | Validity Period Start: ${today}
        Validity Period End: ${date(+3m)}
  - unless: "${rfqExists}"
    click: { text: Delivery and Payment Terms, role: tab }
  - unless: "${rfqExists}"
    fill:
        Target Value: "3000"
        Currency: EUR
  - unless: "${rfqExists}"
    fillCell: { within: Items, row: 1, column: Material, value: "R124-${grp}" }
  - unless: "${rfqExists}"
    fillCell: { within: Items, row: 1, column: Plant, value: "1010" }
  - unless: "${rfqExists}"
    fillCell: { within: Items, row: 1, column: Requested Quantity, value: "300" }
  - unless: "${rfqExists}"
    check: Info Record Update
  - unless: "${rfqExists}"
    click: { text: Create, within: Bidders }
  - unless: "${rfqExists}"
    fillCell: { within: Bidders, row: 1, column: Supplier, value: "IEE2E-${grp}" }
  - unless: "${rfqExists}"
    click: { text: Create, within: Bidders }
  - name: Second bidder (new rows are inserted at the top)
    unless: "${rfqExists}"
    fillCell: { within: Bidders, row: 1, column: Supplier, value: "10300002" }
  - unless: "${rfqExists}"
    click: { text: Create, index: -1 }
  - unless: "${rfqExists}"
    click: Publish
  - unless: "${rfqExists}"
    expectMessage:
        regex: "\\d{9,10}"
        capture: { var: rfqNo, regex: "(\\d{9,10})" }

  # 2. Quotations from both bidders
  - openApp: { title: Manage RFQs }
  - fill: { label: Search, value: "${rfqNo}", enter: true }
  - openRow: ${rfqNo}
  - click: { text: Bidders, role: tab }
  - selectRow: IEE2E-${grp}
  - click: Create Quotation
  - click: { text: Items, role: tab }
  - fillCell: { within: Items, rowContains: "R124-${grp}", column: Net Order Price, value: "${num(9.50)}" }
  - click: Create
  - click: Back
  - selectRow: "10300002"
  - click: Create Quotation
  - click: { text: Items, role: tab }
  - fillCell: { within: Items, rowContains: "R124-${grp}", column: Net Order Price, value: "11" }
  - click: Create
  - click: Back
  - click: { text: Quotations, role: tab }
  - expectText: IEE2E-${grp}
  - expectText: "10300002"

  # 3. Compare and award
  - openApp: { title: Compare Supplier Quotations }
  - select: { label: RFQ, value: "${rfqNo}" }
  - selectRow: IEE2E-${grp}
  - selectRow: "10300002"
  - click: Compare
  - name: Award the best bid (Bicycle Supplies / IEE2E-${grp})
    click: { text: Award, within: "IEE2E-${grp}" }
  - expectNoError: true
