id: IEE2E-18
exercise: 18
title: "Plan rates for cost center / activity type (upload)"
tags: [unit4, co, planning, upload]
requires: [IEE2E-17]
description: |
  Uploads plan cost rates for cost center 10101753 / activity type IT### (2026, periods 001-012,
  fixed rate 100 USD per hour, ledgers 0L and 2L) from uploads/F2121_###_PlanCostRate.xlsx.
  The file is the app's own template (Upload > Download Template) with those two rows from row 7.
  Not uploaded again when IT### already has a plan rate.
vars:
  rateFile: uploads/F2121_${grp}_PlanCostRate.xlsx
steps:
  - openApp: { title: Manage Cost Rates - Plan }
  - fill: { label: Search, value: "IT${grp}", enter: true }
  - click: Go
  - name: Plan rate for IT${grp} there already?
    detect: { row: "IT${grp}", var: rateExists }

  - unless: "${rateExists}"
    click: { text: Upload, role: button }
  - unless: "${rateExists}"
    upload: { file: "${rateFile}", dialog: true }
  - unless: "${rateExists}"
    click: { text: Upload, dialog: true, role: button }
  - name: Close the upload result
    unless: "${rateExists}"
    optional: true
    timeout: 8000
    click: { text: [OK, Ok, Close], dialog: true, role: button }

  - fill: { label: Search, value: "IT${grp}", enter: true }
  - click: Go
  - expectText: IT${grp}
  - expectText: "10101753"
