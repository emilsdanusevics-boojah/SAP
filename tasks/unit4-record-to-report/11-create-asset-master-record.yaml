id: IEE2E-11
exercise: 11
title: "Create Asset Master Record (CNC lathe ###)"
tags: [unit4, fi-aa, master-data]
description: >
  Sets default company code 1010, creates asset "CNC lathe ###" (class 2000; the class requires a
  serial number, ### is used) and sets a useful life of 10 years. If the asset exists already (an earlier attempt), its number is taken over instead.
vars:
  assetName: CNC lathe ${grp}
steps:
  # 1. Default company code 1010 in the user settings
  - name: Open the user menu
    click: { selector: "#userActionsMenuHeaderButton, #meAreaHeaderButton, [id$='meAreaHeaderButton']" }
  - name: Settings (user menu)
    click: { selector: "[id$='userSettingsBtn']" }
  - click: Default Values
  - fill: { label: Company Code, value: "1010", dialog: true }
  - click: { text: Save, dialog: true }

  # 2. Asset master record
  - openApp: { title: Manage Fixed Assets }
  - name: Own drafts left by an earlier attempt
    select: { label: Editing Status, value: Own Draft }
  - click: Go
  - detect: { row: "$", var: assetDraft }
  - when: "${assetDraft}"
    openRow: "$"
  - when: "${assetDraft}"
    click: Discard Draft
  - name: Confirm the discard
    when: "${assetDraft}"
    optional: true
    timeout: 5000
    click: { text: Discard, role: button, index: -1 }
  - select: { label: Editing Status, value: All }
  - name: Filter on the description (the search box matches every "CNC lathe")
    fill: { Asset Description: "${assetName}" }
  - click: Go
  - name: Asset ${assetName} there already?
    detect: { row: "${assetName}", var: assetExists }
  - name: Take over the existing asset number
    when: "${assetExists}"
    capture: { var: assetNo, from: cell, rowContains: "${assetName}", column: "Asset Number | Fixed Asset | Asset", regex: "(\\d{6,12})" }

  - unless: "${assetExists}"
    click: Create
  - unless: "${assetExists}"
    fill:
      dialog: true
      fields:
        Company Code: "1010"
        Asset Class: "2000"
  - unless: "${assetExists}"
    click: { text: [OK, Ok], dialog: true }
  - unless: "${assetExists}"
    fill:
      within: General/Inventory Data
      fields:
        Asset Description: ${assetName}
        Serial Number: ${grp}
  - unless: "${assetExists}"
    click: { text: Time-Dependent Data, role: tab }
  - unless: "${assetExists}"
    fill: { Cost Center: "BIKEA-${grp}" }
  - name: Create (the page's button, not the list's)
    unless: "${assetExists}"
    click: { text: Create, role: button, index: -1 }
  - unless: "${assetExists}"
    expectMessage:
      regex: "created|\\d{6,12}-\\d"
      capture: { var: assetNo, regex: "(\\d{6,12})" }
  - unless: "${assetExists}"
    optional: true
    timeout: 5000
    click: Back
  - unless: "${assetExists}"
    click: Go
  - unless: "${assetExists}"
    expectText: ${assetName}

  # 3. Useful life 10 years in areas 01 and 15 (each area opens in its own column)
  - openRow: ${assetNo}
  - name: Edit (not shown when a draft from an earlier attempt opens)
    optional: true
    timeout: 5000
    click: Edit
  - click: { text: Valuation, role: tab }
  - name: Depreciation area 01
    openRow: { row: 1, within: Valuation }
  - click: { text: General Parameters, role: tab }
  - fill: { Useful Life (Year/Period): "10" }
  - click: Apply
  - name: Depreciation area 15
    openRow: { row: 2, within: Valuation }
  - click: { text: General Parameters, role: tab }
  - fill: { Useful Life (Year/Period): "10" }
  - click: Apply
  - click: Save
  - expectNoError: true
