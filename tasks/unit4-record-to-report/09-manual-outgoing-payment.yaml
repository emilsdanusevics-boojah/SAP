id: IEE2E-09
exercise: 9
title: "Post a Manual Outgoing Payment"
tags: [unit4, fi-ap, payment]
requires: [IEE2E-07]
steps:
  # 1. Vendor invoice
  - openApp: { title: Create Supplier Invoice }
  - name: Start fresh if a draft from an earlier attempt is offered
    optional: true
    timeout: 8000
    click: { text: "No", dialog: true, role: button }
  - select: { label: Transaction, value: Invoice }
  - fill: { Company Code: "1010" }
  - name: Confirm "Data Will Be Lost" (left over from an earlier draft)
    optional: true
    timeout: 4000
    click: { text: OK, dialog: true, role: button }
  - fill:
      Invoice Date: ${today}
      Posting Date: ${today}
  - select: { label: Invoicing Party, value: "IEE2E-${grp}" }
  - fill:
      Gross Invoice Amount: "1100"
      Currency: EUR
      Reference: Invoice 02-${grp}
  - click: { text: G/L Account Items, role: tab }
  - click: { text: Add, within: G/L Account Items }
  - fillCell: { within: G/L Account Items, row: 1, column: G/L Account, value: "65100${grp}" }
  - fillCell: { within: G/L Account Items, row: 1, column: Amount, value: "1000" }
  - fillCell: { within: G/L Account Items, row: 1, column: Tax Code, value: 1I }
  - fillCell: { within: G/L Account Items, row: 1, column: Cost Center, value: "BIKEA-${grp}" }
  - click: Post
  - expectMessage:
      regex: "created|posted"
      capture: { var: apInvoice2, regex: "(\\d{9,10})" }
  - click: { text: "No", dialog: true }

  # 2. Single payment
  - openApp: { title: Manage Supplier Line Items }
  - fill:
      Supplier: IEE2E-${grp}
      Company Code: "1010"
  - select: { label: Status, value: Open Items }
  - click: Go
  - selectRow: Invoice 02-${grp}
  - click: Create Single Payment
  - click: { text: Create, dialog: true }
  - name: Accept the payment proposal
    optional: true
    click: Accept
  - expectMessage:
      regex: "payment run"
      capture: { var: singlePaymentRun, regex: "[Pp]ayment run\\s+(\\S+)" }
  - optional: true
    click: Back to Supplier Line Items Application

  # 3. Check automatic payments
  - openApp: { title: Manage Automatic Payments }
  - fill:
      Created By: ${user}
      Company Code: "1010"
  - click: Go
  - click: { text: Payments Processed, role: tab }
  - expectText: Payment Posted
  - screenshot: payment-run
